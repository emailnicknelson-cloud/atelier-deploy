  <title>Agentic Self-Direction Patterns | Autonomous AI Execution Loops & Prompts</title>
  <meta name="description" content="Comprehensive library of autonomous AI agent patterns, execution loops (ReAct, OODA, Reflexion), prompt architectures, and sovereign self-direction frameworks.">
  <meta property="og:title" content="Agentic Self-Direction Patterns">
  <meta property="og:description" content="Comprehensive library of autonomous AI agent patterns, execution loops, and prompt architectures.">
  <meta property="og:type" content="article">
  <meta name="keywords" content="AI Agents, Autonomous Agents, LLM Patterns, Prompt Engineering, Execution Loops, ReAct, OODA Loop, Reflexion, AI Architecture">
  <link rel="canonical" href="https://whisperworkshop.com/agentic-knowledge-space.html">

  <style>
    :root {
      --bg: #000000;
      --bg-surface: #080808;
      --bg-card: #0a0a0a;
      --bg-card-hover: #111111;
      --border: rgba(231, 222, 209, 0.12);
      --border-hover: rgba(231, 222, 209, 0.35);
      --text: #e7ded1;
      --text-dim: rgba(231, 222, 209, 0.55);
      --text-muted: rgba(231, 222, 209, 0.3);
      --accent: #e7ded1;
      --accent-light: #e7ded1;
      --accent-glow: rgba(231, 222, 209, 0.06);
      --green: rgba(231, 222, 209, 0.65);
      --amber: rgba(231, 222, 209, 0.4);
      --red: rgba(231, 222, 209, 0.5);
      --cyan: #e7ded1;
      --radius: 0px;
      --radius-sm: 0px;
      --shadow: 0 1px 0 var(--border);
      --transition: 0.2s ease;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      font-family: 'Space Mono', ui-monospace, monospace;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    h1,
    h2,
    .section-title {
      font-family: 'Montserrat', ui-sans-serif, sans-serif;
      font-weight: 400;
    }

    /* === HERO === */
    .hero {
      position: relative;
      padding: 80px 40px 50px;
      text-align: center;
      background: #000000;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: none;
      pointer-events: none;
    }

    .hero h1 {
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 400;
      letter-spacing: -0.03em;
      color: #e7ded1;
      margin-bottom: 12px;
    }

    .hero p {
      color: var(--text-dim);
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto 28px;
    }

    /* === SEARCH === */
    .search-wrap {
      max-width: 520px;
      margin: 0 auto;
      position: relative;
    }

    .search-wrap svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 18px;
      height: 18px;
      pointer-events: none;
    }

    #search {
      width: 100%;
      padding: 14px 18px 14px 44px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    #search::placeholder {
      color: var(--text-muted);
    }

    #search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-count {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    /* === LAYOUT === */
    .layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 0;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* === SIDEBAR === */
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 24px 16px;
      border-right: 1px solid var(--border);
      background: var(--bg-surface);
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .sidebar h3 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin: 20px 0 8px;
      padding-left: 12px;
    }

    .sidebar h3:first-child {
      margin-top: 0;
    }

    .sidebar a {
      display: block;
      padding: 7px 12px;
      font-size: 0.82rem;
      color: var(--text-dim);
      text-decoration: none;
      border-radius: var(--radius-sm);
      transition: background var(--transition), color var(--transition);
      border-left: 2px solid transparent;
      margin-bottom: 2px;
    }

    .sidebar a:hover {
      background: var(--bg-card);
      color: var(--text);
    }

    .sidebar a.active {
      color: var(--accent-light);
      background: var(--accent-glow);
      border-left-color: var(--accent);
    }

    /* === MAIN === */
    .main {
      padding: 40px 48px 100px;
      min-width: 0;
    }

    .section {
      margin-bottom: 56px;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 400;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .section-desc {
      color: var(--text-dim);
      font-size: 0.9rem;
      margin-bottom: 24px;
      font-family: 'Space Mono', ui-monospace, monospace;
    }

    /* === CARDS === */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      cursor: pointer;
      transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: #e7ded1;
      opacity: 0;
      transition: opacity var(--transition);
    }

    .card:hover {
      border-color: var(--border-hover);
      transform: none;
      box-shadow: var(--shadow);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card.expanded {
      border-color: var(--accent);
    }

    .card.expanded::before {
      opacity: 1;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .card-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }

    .card-badge {
      font-size: 0.65rem;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 2px 7px;
      border-radius: 0;
      border: 1px solid var(--border-hover);
      background: transparent;
      color: var(--text-muted);
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-dim);
      line-height: 1.55;
    }

    .card-expand {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .card.expanded .card-expand {
      display: block;
    }

    .card-expand .prompt-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .card-expand blockquote {
      background: var(--bg-surface);
      border-left: 1px solid var(--accent);
      padding: 14px 16px;
      border-radius: 0;
      font-size: 0.85rem;
      color: var(--text);
      font-style: normal;
      line-height: 1.6;
      margin-bottom: 12px;
      position: relative;
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
    }

    .card-expand blockquote:hover {
      background: #0f0f0f;
      border-left-color: var(--accent-light);
    }

    .card-expand blockquote:hover .copy-badge {
      opacity: 1;
      transform: translateY(0);
    }

    .copy-badge {
      position: absolute;
      top: 8px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.68rem;
      font-weight: 600;
      font-style: normal;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent-light);
      background: rgba(124, 92, 252, 0.15);
      border: 1px solid rgba(124, 92, 252, 0.3);
      padding: 3px 9px 3px 7px;
      border-radius: 999px;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
      user-select: none;
    }

    .copy-badge svg {
      width: 11px;
      height: 11px;
      flex-shrink: 0;
    }

    @keyframes bq-flash {
      0% {
        background: rgba(231, 222, 209, 0.1);
        border-left-color: var(--accent-light);
      }

      60% {
        background: rgba(231, 222, 209, 0.05);
        border-left-color: var(--text-dim);
      }

      100% {
        background: var(--bg-surface);
        border-left-color: var(--accent);
      }
    }

    .blockquote-copied {
      animation: bq-flash 0.7s ease forwards;
    }

    /* === COPY TOAST === */
    #copy-toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #1e2030;
      border: 1px solid var(--green);
      color: var(--green);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 999px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(52, 211, 153, 0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 9999;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #copy-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #copy-toast svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .card-expand .rationale {
      font-size: 0.82rem;
      color: var(--text-dim);
      line-height: 1.6;
    }

    .card-expand .patterns-used {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .card-expand .patterns-used span {
      font-size: 0.72rem;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text-dim);
      background: var(--bg);
    }

    .card-chevron {
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      transition: transform var(--transition);
      flex-shrink: 0;
    }

    .card.expanded .card-chevron {
      transform: rotate(180deg);
    }

    .card.hidden {
      display: none;
    }

    /* === STATS STRIP === */
    .hero-stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .stat-num {
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.04em;
      line-height: 1;
      color: #e7ded1;
      font-variant-numeric: tabular-nums;
      font-family: 'Montserrat', ui-sans-serif, sans-serif;
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* === PIPS === */
    .pip-row {
      display: flex;
      gap: 4px;
      margin-top: 6px;
      margin-bottom: 2px;
      align-items: center;
    }

    .pip {
      width: 18px;
      height: 5px;
      border-radius: 2px;
      background: var(--accent);
      opacity: 0.9;
      transition: opacity var(--transition);
    }

    .pip-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-left: 6px;
      font-variant-numeric: tabular-nums;
    }

    .card:hover .pip {
      opacity: 1;
    }

    /* === COMPLEXITY LEGEND === */
    .complexity-legend {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .complexity-legend .leg-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-right: 4px;
      flex-shrink: 0;
    }

    .leg-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    .leg-pips {
      display: flex;
      gap: 2px;
    }

    .leg-pip {
      width: 12px;
      height: 4px;
      border-radius: 2px;
    }

    /* === SIDEBAR COUNT BADGE === */
    .sidebar a .nav-count {
      margin-left: auto;
      font-size: 0.65rem;
      background: var(--bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 1px 6px;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .sidebar a {
      display: flex;
      align-items: center;
    }

    /* === MATRIX === */
    .matrix-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
    }

    .matrix-wrap table {
      border-collapse: collapse;
      width: 100%;
      min-width: 800px;
      font-size: 0.72rem;
    }

    .matrix-wrap th,
    .matrix-wrap td {
      padding: 8px 6px;
      text-align: center;
      border: 1px solid var(--border);
      position: relative;
    }

    .matrix-wrap th {
      background: var(--bg-surface);
      color: var(--text-dim);
      font-weight: 600;
      position: sticky;
      top: 0;
    }

    .matrix-wrap th:first-child,
    .matrix-wrap td:first-child {
      text-align: left;
      padding-left: 12px;
      font-weight: 600;
      position: sticky;
      left: 0;
      background: var(--bg-surface);
      z-index: 1;
    }

    .matrix-wrap td.synergy-1 {
      background: rgba(231, 222, 209, 0.03);
    }

    .matrix-wrap td.synergy-2 {
      background: rgba(231, 222, 209, 0.07);
    }

    .matrix-wrap td.synergy-3 {
      background: rgba(231, 222, 209, 0.12);
    }

    .matrix-wrap td.tension {
      background: transparent;
      color: var(--text);
      border: 1px solid rgba(231, 222, 209, 0.25);
    }

    .matrix-wrap td.self {
      background: var(--bg-surface);
      color: var(--text-muted);
    }

    /* Matrix tooltip */
    .matrix-tip {
      display: none;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: #1a1c2e;
      border: 1px solid var(--border-hover);
      color: var(--text);
      font-size: 0.72rem;
      line-height: 1.45;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      width: 200px;
      z-index: 100;
      pointer-events: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      text-align: left;
      white-space: normal;
    }

    .matrix-wrap td:hover .matrix-tip {
      display: block;
    }

    .matrix-notes {
      margin-top: 16px;
      padding: 16px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.82rem;
      color: var(--text-dim);
      line-height: 1.65;
    }

    .matrix-notes strong {
      color: var(--text);
    }

    /* === RESPONSIVE === */
    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: relative;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 12px;
      }

      .sidebar h3 {
        width: 100%;
        margin: 8px 0 4px;
      }

      .sidebar a {
        font-size: 0.75rem;
        padding: 5px 10px;
      }

      .main {
        padding: 24px 20px 80px;
      }

      .card-grid {
        grid-template-columns: 1fr;
      }
    }

    /* === NEW LAB ELEMENTS === */
    .cap-table-wrap, .emerging-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      background: var(--bg-card);
      margin-top: 8px;
    }
    .cap-table-wrap table, .emerging-table-wrap table {
      border-collapse: collapse;
      width: 100%;
      font-size: 0.82rem;
    }
    .cap-table-wrap th, .cap-table-wrap td, .emerging-table-wrap th, .emerging-table-wrap td {
      padding: 9px 14px;
      text-align: left;
      border: 1px solid var(--border);
      line-height: 1.5;
    }
    .cap-table-wrap th, .emerging-table-wrap th {
      background: var(--bg-surface);
      color: var(--text-dim);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .cap-table-wrap td:first-child {
      font-family: 'Space Mono', ui-monospace, monospace;
      color: var(--accent-light);
      white-space: nowrap;
    }
    .cap-table-wrap td, .emerging-table-wrap td {
      color: var(--text-dim);
    }
    
    /* === ANIMATIONS === */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section {
      animation: fadeIn 0.5s ease both;
    }
  </style>

      <h3>Goal-Setting Patterns</h3>
      <p>How the agent defines, structures, and commits to objectives.</p>
      <article id="pattern-self-goal">
        <h4>Self-Goal</h4>
        <p>Agent defines its own goal, success criteria, and pursues until proven complete.</p>
      </article>
      <article id="pattern-goal-decomposition">
        <h4>Goal Decomposition</h4>
        <p>Agent breaks a large goal into sub-goals recursively and resolves each.</p>
      </article>
      <article id="pattern-backtracking-goal">
        <h4>Backtracking Goal</h4>
        <p>Agent sets a goal, attempts it, detects failure, revises the goal, and retries.</p>
      </article>
      <article id="pattern-constraint-discovery">
        <h4>Constraint Discovery</h4>
        <p>Agent explores what is and isn't possible before committing to a goal.</p>
      </article>
      <h3>Execution Loop Patterns</h3>
      <p>Cyclic action-observation frameworks that drive task completion.</p>
      <article id="pattern-react">
        <h4>ReAct</h4>
        <p>Reason → Act → Observe, repeated until task complete.</p>
      </article>
      <article id="pattern-ooda-loop">
        <h4>OODA Loop</h4>
        <p>Observe → Orient → Decide → Act (military-origin, good for adversarial tasks).</p>
      </article>
      <article id="pattern-plan-and-execute">
        <h4>Plan-and-Execute</h4>
        <p>Generate full plan first, then step through it with state tracking.</p>
      </article>
      <article id="pattern-reflexion">
        <h4>Reflexion</h4>
        <p>Act → get feedback → self-critique in natural language → retry with memory of mistakes.</p>
      </article>
      <h3>Self-Improvement Patterns</h3>
      <p>Mechanisms for the agent to evaluate and upgrade its own performance.</p>
      <article id="pattern-self-critique">
        <h4>Self-Critique</h4>
        <p>Agent evaluates its own output against the original goal before delivering.</p>
      </article>
      <article id="pattern-constitutional-ai">
        <h4>Constitutional AI</h4>
        <p>Agent checks its output against a set of rules/principles it carries.</p>
      </article>
      <article id="pattern-meta-cognition">
        <h4>Meta-Cognition</h4>
        <p>Agent monitors how it's thinking and adjusts strategy mid-task.</p>
      </article>
      <article id="pattern-recursive-self-improvement">
        <h4>Recursive Self-Improvement</h4>
        <p>Agent modifies its own prompt/instructions to perform better next iteration.</p>
      </article>
      <h3>Exploration Patterns</h3>
      <p>Strategies for navigating solution spaces and filling knowledge gaps.</p>
      <article id="pattern-tree-of-thought-tot-">
        <h4>Tree of Thought (ToT)</h4>
        <p>Agent branches multiple reasoning paths simultaneously, evaluates, prunes.</p>
      </article>
      <article id="pattern-beam-search-execution">
        <h4>Beam Search Execution</h4>
        <p>Keep top-N candidate action sequences, not just one.</p>
      </article>
      <article id="pattern-curiosity-driven">
        <h4>Curiosity-Driven</h4>
        <p>Agent generates and answers its own questions to fill knowledge gaps before acting.</p>
      </article>
      <article id="pattern-socratic-self-questioning">
        <h4>Socratic Self-Questioning</h4>
        <p>Agent challenges its own assumptions with adversarial questions.</p>
      </article>
      <h3>Multi-Agent Coordination</h3>
      <p>Patterns for distributing work across multiple agent roles.</p>
      <article id="pattern-orchestrator-worker">
        <h4>Orchestrator/Worker</h4>
        <p>One agent delegates to specialized sub-agents.</p>
      </article>
      <article id="pattern-debate-pattern">
        <h4>Debate Pattern</h4>
        <p>Two agents argue opposing sides; a judge agent decides.</p>
      </article>
      <article id="pattern-peer-review">
        <h4>Peer Review</h4>
        <p>Agent A produces output, Agent B critiques, A revises.</p>
      </article>
      <article id="pattern-swarm-stigmergy">
        <h4>Swarm/Stigmergy</h4>
        <p>Many simple agents leaving 'traces' that guide collective behavior.</p>
      </article>
      <h3>Stopping & Validation</h3>
      <p>Exit conditions and verification mechanisms for reliable completion.</p>
      <article id="pattern-proof-gated-completion">
        <h4>Proof-Gated Completion</h4>
        <p>Task isn't done until agent can demonstrate/prove the outcome.</p>
      </article>
      <article id="pattern-human-in-the-loop-gate">
        <h4>Human-in-the-Loop Gate</h4>
        <p>Agent pauses at high-stakes decision points for approval.</p>
      </article>
      <article id="pattern-confidence-threshold">
        <h4>Confidence Threshold</h4>
        <p>Agent only acts when internal confidence exceeds a threshold.</p>
      </article>
      <article id="pattern-falsification-test">
        <h4>Falsification Test</h4>
        <p>Agent tries to disprove its own result before declaring success.</p>
      </article>
      <h3>Double Combinations</h3>
      <article id="combo-self-goal-proof-gated-completion">
        <h4>Self-Goal + Proof-Gated Completion</h4>
        <p><strong>Patterns used:</strong> Self-Goal, Proof-Gated Completion</p>
        <p><strong>Prompt:</strong> Set your own goal for: [thing]. Make it outcome-based, include the validation/proof needed, then pursue it until complete.</p>
        <p><strong>Rationale:</strong> The agent owns the full task lifecycle — it defines what success looks like, establishes how to prove it, and self-terminates only when the proof is satisfied.</p>
      </article>
      <article id="combo-react-reflexion">
        <h4>ReAct + Reflexion</h4>
        <p><strong>Patterns used:</strong> ReAct, Reflexion</p>
        <p><strong>Prompt:</strong> Attempt [task]. After each action, observe the result and critique your own reasoning in one sentence. If the critique reveals a flaw, correct your approach and retry. Stop only when your critique finds nothing to improve.</p>
        <p><strong>Rationale:</strong> ReAct keeps the agent grounded in real observations. Reflexion adds a self-correction layer so failure builds memory rather than being silently repeated.</p>
      </article>
      <article id="combo-goal-decomposition-orchestrator-worker">
        <h4>Goal Decomposition + Orchestrator/Worker</h4>
        <p><strong>Patterns used:</strong> Goal Decomposition, Orchestrator/Worker</p>
        <p><strong>Prompt:</strong> Break [complex task] into the smallest independent sub-tasks possible. For each sub-task, define the worker responsible, the exact input it receives, and the exact output it must return. Execute all sub-tasks in dependency order and assemble the final result.</p>
        <p><strong>Rationale:</strong> Decomposition prevents any single agent from holding too much context. The orchestrator only manages routing and assembly — workers stay focused.</p>
      </article>
      <article id="combo-tree-of-thought-falsification-test">
        <h4>Tree of Thought + Falsification Test</h4>
        <p><strong>Patterns used:</strong> Tree of Thought, Falsification Test</p>
        <p><strong>Prompt:</strong> For [problem], generate three distinct solution approaches. For each approach, actively try to find a case where it would fail or produce a wrong answer. Eliminate any approach that fails its own falsification test. Present only the approach that survived.</p>
        <p><strong>Rationale:</strong> ToT prevents premature commitment. The falsification test forces the agent to steel-man against itself rather than just picking the most confident-sounding branch.</p>
      </article>
      <article id="combo-constitutional-ai-human-in-the-loop-gate">
        <h4>Constitutional AI + Human-in-the-Loop Gate</h4>
        <p><strong>Patterns used:</strong> Constitutional AI, Human-in-the-Loop Gate</p>
        <p><strong>Prompt:</strong> Complete [task] following these constraints: [rule 1], [rule 2], [rule 3]. Before finalizing any output that affects [high-stakes domain], pause and summarize what you are about to do, why it complies with each rule, and what the irreversible consequences are. Wait for approval.</p>
        <p><strong>Rationale:</strong> The constitution keeps the agent aligned during routine operation. The gate activates only for consequential decisions, preserving human oversight where it matters most.</p>
      </article>
      <article id="combo-curiosity-driven-socratic-self-questioning">
        <h4>Curiosity-Driven + Socratic Self-Questioning</h4>
        <p><strong>Patterns used:</strong> Curiosity-Driven, Socratic Self-Questioning</p>
        <p><strong>Prompt:</strong> Before working on [topic], list every assumption you are making. For each, ask: 'What if this is wrong?' Generate the strongest counter-evidence. Only begin once you have stated which assumptions survived and which were revised.</p>
        <p><strong>Rationale:</strong> The agent surfaces hidden priors before they contaminate the output. Socratic questioning prevents motivated reasoning.</p>
      </article>
      <article id="combo-backtracking-goal-confidence-threshold">
        <h4>Backtracking Goal + Confidence Threshold</h4>
        <p><strong>Patterns used:</strong> Backtracking Goal, Confidence Threshold</p>
        <p><strong>Prompt:</strong> Attempt [task] and rate confidence 0–100. If below 80, identify the weakest part, revise only that, and re-rate. Repeat until 80 or five revisions. Report final confidence alongside the answer.</p>
        <p><strong>Rationale:</strong> The threshold prevents both under-refinement and over-refinement. Targeting only the weakest component each pass is efficient.</p>
      </article>
      <h3>Triple Combinations</h3>
      <article id="combo-self-goal-reflexion-proof-gated-completion">
        <h4>Self-Goal + Reflexion + Proof-Gated Completion</h4>
        <p><strong>Patterns used:</strong> Self-Goal, Reflexion, Proof-Gated Completion</p>
        <p><strong>Prompt:</strong> Set your own goal for: [thing]. Make it specific and measurable. After every attempt, write a one-sentence critique of your own output. Use that critique to revise your approach. Continue until you can provide concrete evidence that the goal has been fully achieved.</p>
        <p><strong>Rationale:</strong> Self-Goal gives ownership. Reflexion prevents stagnation by turning each failure into a lesson. Proof-Gated Completion closes the loop — the agent cannot exit until it produces real evidence.</p>
      </article>
      <article id="combo-goal-decomposition-tree-of-thought-falsification-test">
        <h4>Goal Decomposition + Tree of Thought + Falsification Test</h4>
        <p><strong>Patterns used:</strong> Goal Decomposition, Tree of Thought, Falsification Test</p>
        <p><strong>Prompt:</strong> Break [complex problem] into its core independent sub-problems. For each sub-problem, generate two or three distinct solution approaches. For every approach, attempt to construct a counterexample or failure case. Discard approaches that fail. Execute only the surviving approaches in dependency order.</p>
        <p><strong>Rationale:</strong> Decomposition scopes each decision. Tree of Thought ensures no sub-problem is solved with the first idea. Falsification kills weak branches before they poison downstream work.</p>
      </article>
      <article id="combo-curiosity-driven-constitutional-ai-human-in-the-loop-gate">
        <h4>Curiosity-Driven + Constitutional AI + Human-in-the-Loop Gate</h4>
        <p><strong>Patterns used:</strong> Curiosity-Driven, Constitutional AI, Human-in-the-Loop Gate</p>
        <p><strong>Prompt:</strong> Before starting [task], surface every assumption and information gap. Fill gaps with targeted research. Complete the task under constraints: [rule 1], [rule 2], [rule 3]. At any irreversible decision point, stop — summarize the decision, the constraint it implicates, and the consequence of being wrong. Wait for approval.</p>
        <p><strong>Rationale:</strong> Curiosity-Driven front-loading eliminates acting on false assumptions. The constitution governs behavior throughout. The gate reserves human attention for the moments where it actually matters.</p>
      </article>
      <article id="combo-react-peer-review-backtracking-goal">
        <h4>ReAct + Peer Review + Backtracking Goal</h4>
        <p><strong>Patterns used:</strong> ReAct, Peer Review, Backtracking Goal</p>
        <p><strong>Prompt:</strong> Implement [specific output]. After completing it, adopt the perspective of a senior expert who did not write it. Identify the single most likely defect. If found, roll back only the affected part, fix it, and re-review. Repeat until a full expert review finds nothing to flag.</p>
        <p><strong>Rationale:</strong> ReAct grounds each iteration in a concrete artifact. Peer Review forces a deliberate context switch. Backtracking Goal ensures only the defective component is re-done.</p>
      </article>
      <article id="combo-ooda-loop-falsification-test-confidence-threshold">
        <h4>OODA Loop + Falsification Test + Confidence Threshold</h4>
        <p><strong>Patterns used:</strong> OODA Loop, Falsification Test, Confidence Threshold</p>
        <p><strong>Prompt:</strong> Operating in [adversarial context]: Observe the current state and orient by identifying the most dangerous assumption. Attempt to disprove it. If it survives, rate situational confidence 0–100. If below 75, run the loop again targeting the next most dangerous assumption. Act only when confidence reaches 75 or four loops complete.</p>
        <p><strong>Rationale:</strong> OODA forces continuous re-orientation. Falsification targets the highest-risk assumption each loop. The Confidence Threshold creates a rational exit condition.</p>
      </article>
      <article id="combo-constraint-discovery-goal-decomposition-swarm-stigmergy">
        <h4>Constraint Discovery + Goal Decomposition + Swarm/Stigmergy</h4>
        <p><strong>Patterns used:</strong> Constraint Discovery, Goal Decomposition, Swarm/Stigmergy</p>
        <p><strong>Prompt:</strong> Before planning [task], probe boundaries: identify three things you definitely cannot do, three you definitely can, and three uncertain. Decompose into independent work units — none depending on uncertain constraints. Prioritize by how much each unblocks others. Execute highest-priority first; treat each completion as a signal that updates the constraint map.</p>
        <p><strong>Rationale:</strong> Constraint Discovery prevents decomposing around impossibilities. Decomposition into constraint-safe units prevents cascading failures. The Swarm/Stigmergy dynamic emerges from treating completed units as environmental signals.</p>
      </article>
      <h3>Quadruple Combinations</h3>
      <article id="combo-self-goal-goal-decomposition-reflexion-proof-gated">
        <h4>Self-Goal + Goal Decomposition + Reflexion + Proof-Gated</h4>
        <p><strong>Patterns used:</strong> Self-Goal, Goal Decomposition, Reflexion, Proof-Gated Completion</p>
        <p><strong>Prompt:</strong> Define your own specific, measurable goal for: [thing]. Decompose it into the smallest independent sub-goals. Attempt each in dependency order. After each attempt, write a one-sentence critique. If flawed, revise only that sub-goal and retry. Once all complete, construct concrete evidence proving the top-level goal was achieved. Do not stop until that evidence exists.</p>
        <p><strong>Rationale:</strong> Self-Goal gives ownership. Decomposition prevents contamination. Reflexion turns failures into targeted corrections. Proof-Gated Completion ensures real evidence, not rationalized completion.</p>
      </article>
      <article id="combo-constraint-discovery-tot-falsification-peer-review">
        <h4>Constraint Discovery + ToT + Falsification + Peer Review</h4>
        <p><strong>Patterns used:</strong> Constraint Discovery, Tree of Thought, Falsification Test, Peer Review</p>
        <p><strong>Prompt:</strong> Before planning [task], map constraints: possible, impossible, uncertain. Generate three distinct approaches using only possible/uncertain space. For each, construct the strongest counterexample. Eliminate failures. For survivors, adopt a domain expert perspective — identify remaining blind spots. Revise based on that review.</p>
        <p><strong>Rationale:</strong> Constraint mapping prevents false-assumption plans. ToT explores genuinely. Falsification eliminates weak branches. Peer Review catches survivorship bias.</p>
      </article>
      <article id="combo-react-ooda-loop-backtracking-goal-confidence-threshold">
        <h4>ReAct + OODA Loop + Backtracking Goal + Confidence Threshold</h4>
        <p><strong>Patterns used:</strong> ReAct, OODA Loop, Backtracking Goal, Confidence Threshold</p>
        <p><strong>Prompt:</strong> Execute [task]: Observe state → Orient to highest-risk gap → Decide next atomic action → Act → Rate confidence 0–100. If below 70, identify the decision that caused the drop, roll it back, choose differently. Continue until confidence reaches 90 or 10 actions taken. Report final confidence, action log, and rollbacks.</p>
        <p><strong>Rationale:</strong> ReAct anchors to observable reality. OODA forces continuous re-orientation. Backtracking makes corrections surgical. The Confidence Threshold provides a rational, numeric exit condition.</p>
      </article>
      <article id="combo-curiosity-driven-socratic-constitutional-ai-proof-gated">
        <h4>Curiosity-Driven + Socratic + Constitutional AI + Proof-Gated</h4>
        <p><strong>Patterns used:</strong> Curiosity-Driven, Socratic Self-Questioning, Constitutional AI, Proof-Gated Completion</p>
        <p><strong>Prompt:</strong> Before tackling [task], generate every question whose answer would meaningfully change your approach. Rank by impact. Answer the top five. For each remaining assumption, challenge it: 'What is the strongest reason this is wrong?' Complete the task under constraints [rule 1-3]. At completion, produce a verification artifact showing output satisfies task and violates no constraints.</p>
        <p><strong>Rationale:</strong> Curiosity-Driven questioning surfaces decision-changing information. Socratic questioning prevents motivated reasoning. Constitutional AI keeps alignment. Proof-Gated means demonstrable artifact, not plausible answer.</p>
      </article>
      <article id="combo-orchestrator-worker-debate-falsification-confidence">
        <h4>Orchestrator/Worker + Debate + Falsification + Confidence</h4>
        <p><strong>Patterns used:</strong> Orchestrator/Worker, Debate Pattern, Falsification Test, Confidence Threshold</p>
        <p><strong>Prompt:</strong> Decompose [complex decision] into sub-questions. For each, spawn two opposing workers arguing options A and B. Each must also attempt to falsify its own position. A judge evaluates both positions and self-falsifications, selects the stronger one, and rates confidence 0–100. If below 80, generate a synthesizing third position and re-evaluate.</p>
        <p><strong>Rationale:</strong> Orchestration scopes each debate. The Debate Pattern forces genuine opposing views. Falsification eliminates arguments that can't survive self-scrutiny. Confidence Threshold governs when synthesis is needed.</p>
      </article>
      <article id="combo-plan-and-execute-swarm-stigmergy-meta-cognition-hitl-gate">
        <h4>Plan-and-Execute + Swarm/Stigmergy + Meta-Cognition + HitL Gate</h4>
        <p><strong>Patterns used:</strong> Plan-and-Execute, Swarm/Stigmergy, Meta-Cognition, Human-in-the-Loop Gate</p>
        <p><strong>Prompt:</strong> Generate a complete execution plan for [task]: every step, dependencies, expected output. Audit your planning — flag assumptions about difficulty/feasibility without evidence as high-uncertainty. Execute step by step. Treat each completed step as a signal updating uncertainty flags. At high-uncertainty steps, pause with a summary and wait for approval. Output result, updated plan, and uncertainty audit.</p>
        <p><strong>Rationale:</strong> Plan-and-Execute provides structure. Swarm/Stigmergy means completed steps reshape remaining plan. Meta-Cognition surfaces unreliable planning. The Human-in-the-Loop Gate fires only at uncertainty peaks.</p>
      </article>
      <h3>Quintuple Combinations</h3>
      <article id="combo-self-goal-constraint-discovery-decomposition-reflexion-proof-gated">
        <h4>Self-Goal + Constraint Discovery + Decomposition + Reflexion + Proof-Gated</h4>
        <p><strong>Patterns used:</strong> Self-Goal, Constraint Discovery, Goal Decomposition, Reflexion, Proof-Gated Completion</p>
        <p><strong>Prompt:</strong> Define your own goal for: [thing]. Before planning, probe boundaries: three things you can do, three you cannot, three uncertain. Plan only from possible/uncertain space. Decompose into smallest independent sub-goals — none depending on unresolved uncertainty. Attempt each in order. After each, write a one-sentence critique. If flawed, revise only that sub-goal. When all complete, produce one concrete artifact proving the top-level goal was achieved.</p>
        <p><strong>Rationale:</strong> Own the goal → map what's possible → divide into safe units → correct without restart → prove it happened.</p>
      </article>
      <article id="combo-curiosity-driven-socratic-tot-falsification-peer-review">
        <h4>Curiosity-Driven + Socratic + ToT + Falsification + Peer Review</h4>
        <p><strong>Patterns used:</strong> Curiosity-Driven, Socratic Self-Questioning, Tree of Thought, Falsification Test, Peer Review</p>
        <p><strong>Prompt:</strong> Before [task], generate ten questions whose answers would most change your strategy. Answer each. For unanswerable ones, declare known unknowns. Challenge every remaining assumption. Generate three distinct approaches. For each, construct its most devastating counterexample. Eliminate failures. For survivors, adopt a senior expert role — identify the critical gap. Revise. Execute the strongest surviving approach.</p>
        <p><strong>Rationale:</strong> The front-loaded audit prevents acting on a misunderstood problem. Socratic questioning strips motivated reasoning. ToT ensures genuine exploration. Falsification kills weak branches. Peer Review catches survivorship bias.</p>
      </article>
      <article id="combo-react-ooda-reflexion-backtracking-confidence">
        <h4>ReAct + OODA + Reflexion + Backtracking + Confidence</h4>

        <p><strong>Rationale:</strong> Plan-and-Execute creates structure. Meta-Cognition surfaces uncertainty before it becomes failure. Swarm/Stigmergy makes each step a signal that reshapes estimates. Human-in-the-Loop Gate fires at uncertainty peaks. Recursive Self-Improvement makes the rewritten plan the agent's own training artifact.</p>
      </article>
      <article id="combo-constraint-discovery-decomposition-beam-search-confidence-proof-gated">

        <p><strong>Prompt:</strong> Before planning [task], map constraint space: achievable, not, uncertain. Decompose into independent sub-goals avoiding uncertain constraints. For each, generate three candidate paths scored on feasibility, reversibility, and evidence quality. Execute only the top-scoring path. After each sub-goal, rate confidence 0–100. If below 72, promote the second-ranked path. When all complete, produce a verification artifact. Do not deliver without it.</p>
        <p><strong>Rationale:</strong> Constraint Discovery prevents impossible foundations. Decomposition isolates failures. Beam Search maintains ranked fallback paths. Confidence Threshold governs path switching. Proof-Gated closes the system.</p>

        <p><strong>Rationale:</strong> Self-Goal gives ownership. Curiosity-Driven front-loads information. ToT explores approach space. Beam Search maintains ranked fallbacks at two levels. Confidence governs switching. Proof-Gated closes every exit. Failure produces a failure analysis, making failed runs as valuable as successful ones.</p>
      </article>
      <article id="combo-self-goal-constraint-decomposition-reflexion-peer-review-proof-gated">

        <p><strong>Rationale:</strong> Own → bound → divide → self-correct → externally critique → prove. Nothing ships that hasn't passed all six gates.</p>

        <p><strong>Rationale:</strong> The stack is designed to be impossible to shortcut — every layer blocks a specific class of premature convergence.</p>

      <h3>Lab Parameters</h3>
      <article id="lab-entropy-budgeting">
        <h4>Entropy Budgeting</h4>
        <p>Agent is given a fixed exploration budget — max branches, questions, or iterations. Must allocate deliberately, spending more on high-uncertainty decisions.</p>
        <p><strong>Prompt:</strong> You have a budget of [N] total exploration moves across this entire task — branches, questions, alternatives, or retries all draw from the same pool. Allocate them deliberately. Spend more where uncertainty is highest. Track your remaining budget at each step. When exhausted, commit to your best current answer.</p>
      </article>
      <article id="lab-temporal-anchoring">
        <h4>Temporal Anchoring</h4>
        <p>Agent tracks when each piece of information was acquired and applies confidence decay to older evidence. Recency is treated as a signal quality modifier.</p>
        <p><strong>Prompt:</strong> Before acting on any information, note when you acquired it relative to your current position. Apply a staleness penalty: information from more than [N] steps ago is provisional until reconfirmed. If deciding based on stale information, reconfirm first or flag as unverified prior.</p>
      </article>
      <article id="lab-inversion-framing">
        <h4>Inversion Framing</h4>
        <p>Before solving the primary problem, agent fully solves the inverse — what would make this fail? The primary solution is built by explicitly avoiding each identified failure mode.</p>
        <p><strong>Prompt:</strong> Before solving [task], fully solve its inverse: construct the most complete answer to 'what would most reliably produce the worst outcome here?' List every failure mode. Then build your actual solution by explicitly addressing or inverting each failure mode.</p>
      </article>
      <article id="lab-minimal-footprint">
        <h4>Minimal Footprint</h4>
        <p>Agent is constrained to affect only the minimum necessary. Must justify any action beyond the narrowest interpretation and actively prune unrequired side-effects.</p>
        <p><strong>Prompt:</strong> Complete [task] with the minimum possible footprint. Before each action, ask: 'Is this the narrowest intervention that achieves the required outcome?' At completion, list every action and confirm each was necessary.</p>
      </article>
      <article id="lab-stakeholder-simulation">
        <h4>Stakeholder Simulation</h4>
        <p>Before finalizing output, agent simulates the experience of distinct affected parties — end user, skeptic, edge-case user — and revises accordingly.</p>
        <p><strong>Prompt:</strong> Before delivering output for [task], simulate three stakeholders: (1) primary intended user, (2) a skeptic looking for flaws, (3) an edge-case user. For each, identify: what's useful, what would confuse/fail them, what need goes unmet. Revise to address the most significant gaps.</p>
      </article>
      <article id="lab-reversibility-scoring">
        <h4>Reversibility Scoring</h4>
        <p>Before each action, agent scores reversibility (0–10). Actions below threshold require explicit justification. Agent actively prefers reversible paths.</p>
        <p><strong>Prompt:</strong> Before each action in [task], score reversibility 0–10 (0 = permanent, 10 = fully undoable). If below [threshold]: (a) identify a more reversible alternative and explain why it's inferior, or (b) justify why the irreversible action is necessary. Default to most reversible option when outcomes are comparable.</p>
      </article>
      <article id="lab-signal-vs-noise-filtering">
        <h4>Signal vs. Noise Filtering</h4>
        <p>Agent explicitly separates input into signal (causally relevant) and noise (present but not causal). Only signal informs decisions.</p>
        <p><strong>Prompt:</strong> Before any decision in [task], classify all information into: SIGNAL (causally connected — if this changes, outcome changes) and NOISE (present but not causally relevant). Decide based only on signal. For each signal item, state the causal mechanism connecting it to the outcome.</p>
      </article>
      <article id="lab-horizon-scanning">
        <h4>Horizon Scanning</h4>
        <p>Before committing to any action, agent maps second and third-order consequences. Actions with dangerous second-order effects are deprioritized even if first-order effects are desirable.</p>
        <p><strong>Prompt:</strong> Before any significant action in [task], map its consequence chain: (1st order) direct result, (2nd order) what that causes, (3rd order) what the 2nd-order effect causes. Flag any chain with an undesirable outcome at any level. Redesign the action to sever dangerous consequence chains.</p>
      </article>
      <article id="lab-semantic-compression">
        <h4>Semantic Compression</h4>
        <p>At each major decision point, agent compresses entire current understanding into fewest possible words that preserve all decision-relevant information.</p>
        <p><strong>Prompt:</strong> At each major decision point in [task], compress your current understanding into a single statement of no more than 30 words that captures everything decision-relevant. Use this compressed statement — not the full context — as the basis for your next decision. Log each compression.</p>
      </article>
      <article id="lab-contrastive-anchoring">
        <h4>Contrastive Anchoring</h4>
        <p>Agent defines success by contrast — identifies the closest possible failure state and specifies the minimum distinguishing feature separating them.</p>
        <p><strong>Prompt:</strong> Before delivering output for [task], identify the closest failure state — output most similar to yours but still wrong. Specify the single minimum distinguishing feature. Verify that feature is clearly present in your actual output. Do not deliver if you cannot name or confirm it.</p>
      </article>
      <article id="lab-resource-constrained-execution">
        <h4>Resource-Constrained Execution</h4>
        <p>Agent operates under explicit resource limits (steps, tool calls, time) and must make deliberate tradeoffs as it approaches those limits.</p>
        <p><strong>Prompt:</strong> You have a limit of [N] steps to complete [task]. Before starting, allocate your budget: which parts consume the most steps, which are highest priority? Track consumption. At 75%, assess if on track. At 90%, commit to current best answer and use remaining budget only for highest-value finishing actions.</p>
      </article>
      <article id="lab-causal-tracing">
        <h4>Causal Tracing</h4>
        <p>For each decision, agent explicitly predicts the causal chain before acting. At completion, compares predicted chains to actual ones. Gaps are the primary learning output.</p>
        <p><strong>Prompt:</strong> Before each major decision in [task], write a one-line prediction: 'If I do [action], then [result] because [mechanism], which leads to [downstream effect].' After the action, observe the actual result. At completion, compare every predicted chain to what happened. Identify divergences and state the correct causal mechanism.</p>
      </article>

      var matrixSec_claude = el('section', 'section');
      matrixSec_claude.id = 'claude-matrix';
      matrixSec_claude.innerHTML = '<h2 class="section-title">📐 Claude Interaction Matrix</h2><p class="section-desc">Hover any cell for details. Tension surfaces known tradeoffs.</p>';
      var wrap_claude = el('div', 'matrix-wrap');
      var thead_claude = '<thead><tr><th></th>' + claudeMatrixLabels.map(function (l) { return '<th>' + l + '</th>'; }).join('') + '</tr></thead>';
      
      var tensionLookup_claude = {};
      claudeMatrixNotes.forEach(function(note) {
          var parts = note.split(':');
          var names = parts[0].split('+');
          if (names.length > 1) {
              var a = names[0].trim();
              var b = names[1].trim();
              var ai = claudeMatrixLabels.indexOf(a);
              var bi = claudeMatrixLabels.indexOf(b);
              if (ai !== -1 && bi !== -1) {
                  tensionLookup_claude[ai + ',' + bi] = note;
                  tensionLookup_claude[bi + ',' + ai] = note;
              }
          }
      });
      
      var synergyCounts_claude = claudeMatrixGrid.map(function (row) {
        return row.filter(function (v) { return v === 'S'; }).length;
      });
      var maxSyn_claude = Math.max.apply(null, synergyCounts_claude) || 1;

      var tbody_claude = '<tbody>' + claudeMatrixGrid.map(function (row, i) {
        return '<tr><td>' + claudeMatrixLabels[i] + '</td>' + row.map(function (v, j) {
          if (v === '-') return '<td class="self">—</td>';
          if (v === 'T') {
            var key = i + ',' + j;
            var tipText = tensionLookup_claude[key] ? tensionLookup_claude[key] : 'Known tension — use with care.';
            return '<td class="tension">⚠️<span class="matrix-tip">' + tipText + '</span></td>';
          }
          var density = synergyCounts_claude[i] / maxSyn_claude;
          var cls = density > 0.75 ? 'synergy-3' : density > 0.5 ? 'synergy-2' : 'synergy-1';
          return '<td class="' + cls + '"><span class="matrix-tip">Synergy: ' + claudeMatrixLabels[i] + ' × ' + claudeMatrixLabels[j] + '</span>✓</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody>';
      wrap_claude.innerHTML = '<table>' + thead_claude + tbody_claude + '</table>';
      matrixSec_claude.appendChild(wrap_claude);
      var notesEl_claude = el('div', 'matrix-notes');
      notesEl_claude.innerHTML = '<strong>Notes on tensions:</strong><br>' + claudeMatrixNotes.map(function (n) { return '• ' + n; }).join('<br>');
      matrixSec_claude.appendChild(notesEl_claude);
      main.appendChild(matrixSec_claude);
      
      // Cross-Reference Section
      var xrefSec_claude = el('section', 'section');
      xrefSec_claude.id = 'claude-crossref';
      xrefSec_claude.innerHTML = '<h2 class="section-title">📌 Cross-Reference: Base Lab Parameters</h2><p class="section-desc">Parameters from the core agentic-patterns-lab that show particularly strong behavior with Claude.</p>';
      var xrefWrap_claude = el('div', 'matrix-wrap');
      var xThead_claude = '<thead><tr><th>Base Parameter</th><th>Why It Works Well</th><th>Best Partner</th></tr></thead>';
      var xTbody_claude = '<tbody>' + claudeCrossRefParams.map(function(xp) {
        return '<tr><td style="text-align:left;font-weight:600">' + xp.param + '</td><td style="text-align:left">' + xp.why + '</td><td style="text-align:left">+ ' + xp.partner + '</td></tr>';
      }).join('') + '</tbody></table>';
      xrefWrap_claude.innerHTML = '<table>' + xThead_claude + xTbody_claude + '</table>';
      xrefSec_claude.appendChild(xrefWrap_claude);
      main.appendChild(xrefSec_claude);


      // --- Gemini LAB ---
      
      // Capability Map
      var capSec_gemini = el('section', 'section');
      capSec_gemini.id = 'gemini-capmap';
      capSec_gemini.innerHTML = '<h2 class="section-title">🧬 Gemini Capability Map</h2><p class="section-desc">Each parameter tag corresponds to a Gemini capability. Only apply a pattern when that capability is active in your configuration.</p>';
      var capWrap_gemini = el('div', 'cap-table-wrap');
      capWrap_gemini.innerHTML = '<table><thead><tr><th>Tag</th><th>Capability</th><th>When Active</th></tr></thead><tbody>' +
        geminiCapabilityMap.map(function(r) {
          return '<tr><td>' + r.tag + '</td><td>' + r.capability + '</td><td>' + r.when + '</td></tr>';
        }).join('') + '</tbody></table>';
      capSec_gemini.appendChild(capWrap_gemini);
      main.appendChild(capSec_gemini);

      // Parameters
      var labGrid_gemini = addSection('gemini-parameters', '🔷', 'Gemini-Specific Parameters', 'Experimental parameters targeting Gemini architectural traits.');
      geminiParameters.forEach(function (p) { labGrid_gemini.appendChild(labCard(p)); });

      // Emerging Patterns
      var emergingSec_gemini = el('section', 'section');
      emergingSec_gemini.id = 'gemini-emerging';
      emergingSec_gemini.innerHTML = '<h2 class="section-title">🧪 Emerging Gemini Patterns</h2><p class="section-desc">Single-parameter behaviors specific to Gemini.</p>';
      var emergingTable_gemini = el('div', 'matrix-wrap');
      var eThead_gemini = '<thead><tr><th>Pattern Name</th><th>Parameter</th><th>Behavior Targeted</th><th>Status</th></tr></thead>';
      var eTbody_gemini = '<tbody>' + geminiEmergingPatterns.map(function(ep) {
        return '<tr><td style="text-align:left;font-weight:600">' + ep.name + '</td><td style="text-align:left">' + (ep.param || ep.tag || '') + '</td><td style="text-align:left">' + ep.behavior + '</td><td><span class="card-badge">' + ep.status + '</span></td></tr>';
      }).join('') + '</tbody>';
      emergingTable_gemini.innerHTML = '<table>' + eThead_gemini + eTbody_gemini + '</table>';
      emergingSec_gemini.appendChild(emergingTable_gemini);
      main.appendChild(emergingSec_gemini);

      // Combos
      var comboGrid_gemini = addSection('gemini-combinations', '🧪', 'Gemini Combination Lab', 'Experimental 2–6 parameter stacks tuned for Gemini.');
      geminiCombos.forEach(function (c) { comboGrid_gemini.appendChild(comboCard(c)); });

      // Matrix
      var matrixSec_gemini = el('section', 'section');
      matrixSec_gemini.id = 'gemini-matrix';
      matrixSec_gemini.innerHTML = '<h2 class="section-title">📐 Gemini Interaction Matrix</h2><p class="section-desc">Hover any cell for details. Tension surfaces known tradeoffs.</p>';
      var wrap_gemini = el('div', 'matrix-wrap');
      var thead_gemini = '<thead><tr><th></th>' + geminiMatrixLabels.map(function (l) { return '<th>' + l + '</th>'; }).join('') + '</tr></thead>';
      
      var tensionLookup_gemini = {};
      geminiMatrixNotes.forEach(function(note) {
          var parts = note.split(':');
          var names = parts[0].split('+');
          if (names.length > 1) {
              var a = names[0].trim();
              var b = names[1].trim();
              var ai = geminiMatrixLabels.indexOf(a);
              var bi = geminiMatrixLabels.indexOf(b);
              if (ai !== -1 && bi !== -1) {
                  tensionLookup_gemini[ai + ',' + bi] = note;
                  tensionLookup_gemini[bi + ',' + ai] = note;
              }
          }
      });
      
      var synergyCounts_gemini = geminiMatrixGrid.map(function (row) {
        return row.filter(function (v) { return v === 'S'; }).length;
      });
      var maxSyn_gemini = Math.max.apply(null, synergyCounts_gemini) || 1;

      var tbody_gemini = '<tbody>' + geminiMatrixGrid.map(function (row, i) {
        return '<tr><td>' + geminiMatrixLabels[i] + '</td>' + row.map(function (v, j) {
          if (v === '-') return '<td class="self">—</td>';
          if (v === 'T') {
            var key = i + ',' + j;
            var tipText = tensionLookup_gemini[key] ? tensionLookup_gemini[key] : 'Known tension — use with care.';
            return '<td class="tension">⚠️<span class="matrix-tip">' + tipText + '</span></td>';
          }
          var density = synergyCounts_gemini[i] / maxSyn_gemini;
          var cls = density > 0.75 ? 'synergy-3' : density > 0.5 ? 'synergy-2' : 'synergy-1';
          return '<td class="' + cls + '"><span class="matrix-tip">Synergy: ' + geminiMatrixLabels[i] + ' × ' + geminiMatrixLabels[j] + '</span>✓</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody>';
      wrap_gemini.innerHTML = '<table>' + thead_gemini + tbody_gemini + '</table>';
      matrixSec_gemini.appendChild(wrap_gemini);
      var notesEl_gemini = el('div', 'matrix-notes');
      notesEl_gemini.innerHTML = '<strong>Notes on tensions:</strong><br>' + geminiMatrixNotes.map(function (n) { return '• ' + n; }).join('<br>');
      matrixSec_gemini.appendChild(notesEl_gemini);
      main.appendChild(matrixSec_gemini);
      

      addSidebarGroup('Claude Lab', [
          {id: 'claude-parameters', text: '🔬 Parameters'},
          {id: 'claude-emerging', text: '🧪 Emerging Patterns'},
          {id: 'claude-combinations', text: '🧪 Combination Lab'},
          {id: 'claude-matrix', text: '📐 Interaction Matrix'},
          {id: 'claude-crossref', text: '📌 Cross-Reference'}
      ]);

      addSidebarGroup('Gemini Lab', [
          {id: 'gemini-capmap', text: '🧬 Capability Map'},
          {id: 'gemini-parameters',  text: '🔬 Parameters'},
          {id: 'gemini-combinations', text: '🧪 Combination Lab'},
          {id: 'gemini-emerging',    text: '🧬 Emerging Patterns'},
          {id: 'gemini-matrix',      text: '📐 Interaction Matrix'}
      ]);


      // --- Hero Stats ---
      var totalPatterns = coreCategories.reduce(function (acc, cat) { return acc + cat.patterns.length; }, 0);
      var totalCombos = combinations[0].combos.length + triplesCombos.length + quadsCombos.length + quintsCombos.length + sextupleCombos.length + claudeCombos.length + geminiCombos.length;
      var totalLab = labParameters.length + claudeParameters.length + geminiParameters.length;
      var statsEl = document.getElementById('heroStats');
      if (statsEl) {
        statsEl.innerHTML = [
          { num: totalPatterns, label: 'Core Patterns' },
          { num: totalCombos, label: 'Combinations' },
          { num: totalLab, label: 'Lab Parameters' }
        ].map(function (s) {
          return '<div class="stat-item"><span class="stat-num" id="stat-' + s.label.replace(/\s+/g, '-').toLowerCase() + '">' + s.num + '</span><span class="stat-label">' + s.label + '</span></div>';
        }).join('');
        // Animate counters
        statsEl.querySelectorAll('.stat-num').forEach(function (el) {
          var target = parseInt(el.textContent, 10);
          var start = 0;
          var duration = 900;
          var startTime = null;
          function step(timestamp) {
            if (!startTime) startTime = timestamp;
            var progress = Math.min((timestamp - startTime) / duration, 1);
            var eased = 1 - Math.pow(1 - progress, 3);
            el.textContent = Math.round(start + eased * (target - start));
            if (progress < 1) requestAnimationFrame(step);
          }
          requestAnimationFrame(step);
        });
      }

      // --- Scroll Spy ---
      var sidebarLinks = sidebar.querySelectorAll('a');
      var sections = main.querySelectorAll('.section');
      function updateScrollSpy() {
        var scrollY = window.scrollY + 120;
        var active = null;
        sections.forEach(function (s) { if (s.offsetTop <= scrollY) active = s.id; });
        sidebarLinks.forEach(function (a) {
          a.classList.toggle('active', a.dataset.target === active);
        });
      }
      window.addEventListener('scroll', updateScrollSpy);
      updateScrollSpy();

      // --- Search ---
      searchInput.addEventListener('input', function () {
        var q = this.value.toLowerCase().trim();
        var allCards = main.querySelectorAll('.card');
        var visible = 0;
        allCards.forEach(function (card) {
          var match = !q || card.dataset.search.indexOf(q) !== -1;
          card.classList.toggle('hidden', !match);
          if (match) visible++;
        });
        searchCount.textContent = q ? visible + ' match' + (visible !== 1 ? 'es' : '') : '';
      });

      // --- Copy to Clipboard ---
      // Inject toast element
      var toast = document.createElement('div');
      toast.id = 'copy-toast';
      toast.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Copied to clipboard';
      document.body.appendChild(toast);

      var toastTimer = null;
      function showToast() {
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2200);
      }

      // Delegated click handler — intercepts clicks on blockquotes inside .card-expand
      main.addEventListener('click', function (e) {
        var bq = e.target.closest('.card-expand blockquote');
        if (!bq) return;
        // Stop the event propagating to the card so it doesn't toggle expand
        e.stopPropagation();
        // Get the text content minus the copy badge text
        var badge = bq.querySelector('.copy-badge');
        var textToCopy = badge
          ? bq.textContent.replace(badge.textContent, '').trim()
          : bq.textContent.trim();
        navigator.clipboard.writeText(textToCopy).then(function () {
          bq.classList.remove('blockquote-copied');
          // Force reflow to restart animation
          void bq.offsetWidth;
          bq.classList.add('blockquote-copied');
          showToast();
        }).catch(function () {
          // Fallback for browsers without clipboard API
          var ta = document.createElement('textarea');
          ta.value = textToCopy;
          ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;';
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); showToast(); } catch (err) { }
          document.body.removeChild(ta);
        });
      });
    })();
  </script>

</body>
