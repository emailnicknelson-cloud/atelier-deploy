<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cthdrl — Pattern Space</title>
<meta name="description" content="Pattern systems for autonomous agents. Execution loops, combination stacks, and experimental parameters.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000000;
  --bg-surface: #080808;
  --bg-card: #0a0a0a;
  --bg-card-hover: #111111;
  --border: rgba(231,222,209,0.12);
  --border-hover: rgba(231,222,209,0.35);
  --text: #e7ded1;
  --text-dim: rgba(231,222,209,0.55);
  --text-muted: rgba(231,222,209,0.3);
  --accent: #e7ded1;
  --accent-light: #e7ded1;
  --accent-glow: rgba(231,222,209,0.06);
  --green: rgba(231,222,209,0.65);
  --amber: rgba(231,222,209,0.4);
  --red: rgba(231,222,209,0.5);
  --cyan: #e7ded1;
  --radius: 0px;
  --radius-sm: 0px;
  --shadow: 0 1px 0 var(--border);
  --transition: 0.2s ease;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 90px; }
body {
  font-family: 'Space Mono', ui-monospace, monospace;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
h1, h2, .section-title {
  font-family: 'Montserrat', ui-sans-serif, sans-serif;
  font-weight: 400;
}
/* === HERO === */
.hero {
  position: relative;
  padding: 80px 40px 50px;
  text-align: center;
  background: #000000;
  border-bottom: 1px solid var(--border);
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute; inset: 0;
  background: none;
  pointer-events: none;
}
.hero h1 {
  font-size: clamp(2rem, 4vw, 3.2rem);
  font-weight: 400;
  letter-spacing: -0.03em;
  color: #e7ded1;
  margin-bottom: 12px;
}
.hero p {
  color: var(--text-dim);
  font-size: 1.1rem;
  max-width: 600px;
  margin: 0 auto 28px;
}
/* === SEARCH === */
.search-wrap {
  max-width: 520px;
  margin: 0 auto;
  position: relative;
}
.search-wrap svg {
  position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted);
  width: 18px; height: 18px;
  pointer-events: none;
}
#search {
  width: 100%;
  padding: 14px 18px 14px 44px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--text);
  font-size: 0.95rem;
  font-family: inherit;
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}
#search::placeholder { color: var(--text-muted); }
#search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.search-count {
  position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); font-size: 0.8rem;
}
/* === LAYOUT === */
.layout {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 0;
  max-width: 1400px;
  margin: 0 auto;
}
/* === SIDEBAR === */
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  padding: 24px 16px;
  border-right: 1px solid var(--border);
  background: var(--bg-surface);
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.sidebar h3 {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin: 20px 0 8px;
  padding-left: 12px;
}
.sidebar h3:first-child { margin-top: 0; }
.sidebar a {
  display: block;
  padding: 7px 12px;
  font-size: 0.82rem;
  color: var(--text-dim);
  text-decoration: none;
  border-radius: var(--radius-sm);
  transition: background var(--transition), color var(--transition);
  border-left: 2px solid transparent;
  margin-bottom: 2px;
}
.sidebar a:hover { background: var(--bg-card); color: var(--text); }
.sidebar a.active {
  color: var(--accent-light);
  background: var(--accent-glow);
  border-left-color: var(--accent);
}
/* === MAIN === */
.main { padding: 40px 48px 100px; min-width: 0; }
.section { margin-bottom: 56px; }
.section-title {
  font-size: 1.5rem;
  font-weight: 400;
  margin-bottom: 6px;
  letter-spacing: -0.02em;
}
.section-desc {
  color: var(--text-dim);
  font-size: 0.9rem;
  margin-bottom: 24px;
  font-family: 'Space Mono', ui-monospace, monospace;
}
/* === CARDS === */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 22px;
  cursor: pointer;
  transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition);
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0;
  height: 1px;
  background: #e7ded1;
  opacity: 0;
  transition: opacity var(--transition);
}
.card:hover { border-color: var(--border-hover); transform: none; box-shadow: var(--shadow); }
.card:hover::before { opacity: 1; }
.card.expanded { border-color: var(--accent); }
.card.expanded::before { opacity: 1; }
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.card-name {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text);
}
.card-badge {
  font-size: 0.65rem;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 2px 7px;
  border-radius: 0;
  border: 1px solid var(--border-hover);
  background: transparent;
  color: var(--text-muted);
}
.card-desc {
  font-size: 0.85rem;
  color: var(--text-dim);
  line-height: 1.55;
}
.card-expand {
  display: none;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.card.expanded .card-expand { display: block; }
.card-expand .prompt-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  margin-bottom: 6px;
}
.card-expand blockquote {
  background: var(--bg-surface);
  border-left: 1px solid var(--accent);
  padding: 14px 16px;
  border-radius: 0;
  font-size: 0.85rem;
  color: var(--text);
  font-style: normal;
  line-height: 1.6;
  margin-bottom: 12px;
  position: relative;
  cursor: pointer;
  transition: background var(--transition), border-color var(--transition);
}
.card-expand blockquote:hover {
  background: #0f0f0f;
  border-left-color: var(--accent-light);
}
.card-expand blockquote:hover .copy-badge { opacity: 1; transform: translateY(0); }
.copy-badge {
  position: absolute;
  top: 8px;
  right: 10px;
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.68rem;
  font-weight: 600;
  font-style: normal;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--accent-light);
  background: rgba(124,92,252,0.15);
  border: 1px solid rgba(124,92,252,0.3);
  padding: 3px 9px 3px 7px;
  border-radius: 999px;
  opacity: 0;
  transform: translateY(-4px);
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none;
  user-select: none;
}
.copy-badge svg { width: 11px; height: 11px; flex-shrink: 0; }
@keyframes bq-flash {
  0%   { background: rgba(231,222,209,0.1); border-left-color: var(--accent-light); }
  60%  { background: rgba(231,222,209,0.05); border-left-color: var(--text-dim); }
  100% { background: var(--bg-surface); border-left-color: var(--accent); }
}
.blockquote-copied { animation: bq-flash 0.7s ease forwards; }
/* === COPY TOAST === */
#copy-toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: #1e2030;
  border: 1px solid var(--green);
  color: var(--green);
  font-size: 0.82rem;
  font-weight: 600;
  padding: 10px 20px;
  border-radius: 999px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.5), 0 0 0 1px rgba(52,211,153,0.2);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
  z-index: 9999;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
}
#copy-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
#copy-toast svg { width: 15px; height: 15px; flex-shrink: 0; }
.card-expand .rationale {
  font-size: 0.82rem;
  color: var(--text-dim);
  line-height: 1.6;
}
.card-expand .patterns-used {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-bottom: 12px;
}
.card-expand .patterns-used span {
  font-size: 0.72rem;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--text-dim);
  background: var(--bg);
}
.card-chevron {
  width: 18px; height: 18px;
  color: var(--text-muted);
  transition: transform var(--transition);
  flex-shrink: 0;
}
.card.expanded .card-chevron { transform: rotate(180deg); }
.card.hidden { display: none; }
/* === STATS STRIP === */
.hero-stats {
  display: flex;
  justify-content: center;
  gap: 32px;
  margin-top: 28px;
  flex-wrap: wrap;
}
.stat-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.stat-num {
  font-size: 2rem;
  font-weight: 400;
  letter-spacing: -0.04em;
  line-height: 1;
  color: #e7ded1;
  font-variant-numeric: tabular-nums;
  font-family: 'Montserrat', ui-sans-serif, sans-serif;
}
.stat-label {
  font-size: 0.72rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
/* === PIPS === */
.pip-row {
  display: flex;
  gap: 4px;
  margin-top: 6px;
  margin-bottom: 2px;
  align-items: center;
}
.pip {
  width: 18px;
  height: 5px;
  border-radius: 2px;
  background: var(--accent);
  opacity: 0.9;
  transition: opacity var(--transition);
}
.pip-label {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-left: 6px;
  font-variant-numeric: tabular-nums;
}
.card:hover .pip { opacity: 1; }
/* === COMPLEXITY LEGEND === */
.complexity-legend {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.complexity-legend .leg-label {
  font-size: 0.7rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  margin-right: 4px;
  flex-shrink: 0;
}
.leg-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.72rem;
  color: var(--text-dim);
}
.leg-pips {
  display: flex;
  gap: 2px;
}
.leg-pip {
  width: 12px;
  height: 4px;
  border-radius: 2px;
}
/* === SIDEBAR COUNT BADGE === */
.sidebar a .nav-count {
  margin-left: auto;
  font-size: 0.65rem;
  background: var(--bg);
  color: var(--text-muted);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 1px 6px;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}
.sidebar a {
  display: flex;
  align-items: center;
}
/* === MATRIX === */
.matrix-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-card);
}
.matrix-wrap table {
  border-collapse: collapse;
  width: 100%;
  min-width: 800px;
  font-size: 0.72rem;
}
.matrix-wrap th, .matrix-wrap td {
  padding: 8px 6px;
  text-align: center;
  border: 1px solid var(--border);
  position: relative;
}
.matrix-wrap th {
  background: var(--bg-surface);
  color: var(--text-dim);
  font-weight: 600;
  position: sticky;
  top: 0;
}
.matrix-wrap th:first-child, .matrix-wrap td:first-child {
  text-align: left;
  padding-left: 12px;
  font-weight: 600;
  position: sticky;
  left: 0;
  background: var(--bg-surface);
  z-index: 1;
}
.matrix-wrap td.synergy-1 { background: rgba(231,222,209,0.03); }
.matrix-wrap td.synergy-2 { background: rgba(231,222,209,0.07); }
.matrix-wrap td.synergy-3 { background: rgba(231,222,209,0.12); }
.matrix-wrap td.tension { background: transparent; color: var(--text); border: 1px solid rgba(231,222,209,0.25); }
.matrix-wrap td.self { background: var(--bg-surface); color: var(--text-muted); }
/* Matrix tooltip */
.matrix-tip {
  display: none;
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: #1a1c2e;
  border: 1px solid var(--border-hover);
  color: var(--text);
  font-size: 0.72rem;
  line-height: 1.45;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  width: 200px;
  z-index: 100;
  pointer-events: none;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  text-align: left;
  white-space: normal;
}
.matrix-wrap td:hover .matrix-tip { display: block; }
.matrix-notes {
  margin-top: 16px;
  padding: 16px 20px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 0.82rem;
  color: var(--text-dim);
  line-height: 1.65;
}
.matrix-notes strong { color: var(--text); }
/* === RESPONSIVE === */
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar {
    position: relative; height: auto;
    border-right: none; border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 4px; padding: 12px;
  }
  .sidebar h3 { width: 100%; margin: 8px 0 4px; }
  .sidebar a { font-size: 0.75rem; padding: 5px 10px; }
  .main { padding: 24px 20px 80px; }
  .card-grid { grid-template-columns: 1fr; }
}
/* === ANIMATIONS === */
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.section { animation: fadeIn 0.5s ease both; }
</style>
</head>

    <input type="text" id="search" placeholder="Search patterns, combinations, parameters..." autocomplete="off">
    <span class="search-count" id="searchCount"></span>
  </div>

</div>

<!-- LAYOUT -->
<div class="layout">

  <div class="main" id="main"></div>

<!-- DATA + LOGIC -->
<script>
// ===== CORE PATTERN DATA =====
const coreCategories = [
  {
    id: "goal-setting", icon: "🎯", title: "Goal-Setting Patterns",
    desc: "How the agent defines, structures, and commits to objectives.",
    patterns: [
      { name: "Self-Goal", desc: "Agent defines its own goal, success criteria, and pursues until proven complete." },
      { name: "Goal Decomposition", desc: "Agent breaks a large goal into sub-goals recursively and resolves each." },
      { name: "Backtracking Goal", desc: "Agent sets a goal, attempts it, detects failure, revises the goal, and retries." },
      { name: "Constraint Discovery", desc: "Agent explores what is and isn't possible before committing to a goal." }
    ]
  },
  {
    id: "execution-loops", icon: "🔁", title: "Execution Loop Patterns",
    desc: "Cyclic action-observation frameworks that drive task completion.",
    patterns: [
      { name: "ReAct", desc: "Reason → Act → Observe, repeated until task complete." },
      { name: "OODA Loop", desc: "Observe → Orient → Decide → Act (military-origin, good for adversarial tasks)." },
      { name: "Plan-and-Execute", desc: "Generate full plan first, then step through it with state tracking." },
      { name: "Reflexion", desc: "Act → get feedback → self-critique in natural language → retry with memory of mistakes." }
    ]
  },
  {
    id: "self-improvement", icon: "🧠", title: "Self-Improvement Patterns",
    desc: "Mechanisms for the agent to evaluate and upgrade its own performance.",
    patterns: [
      { name: "Self-Critique", desc: "Agent evaluates its own output against the original goal before delivering." },
      { name: "Constitutional AI", desc: "Agent checks its output against a set of rules/principles it carries." },
      { name: "Meta-Cognition", desc: "Agent monitors how it's thinking and adjusts strategy mid-task." },
      { name: "Recursive Self-Improvement", desc: "Agent modifies its own prompt/instructions to perform better next iteration." }
    ]
  },
  {
    id: "exploration", icon: "🗺️", title: "Exploration Patterns",
    desc: "Strategies for navigating solution spaces and filling knowledge gaps.",
    patterns: [
      { name: "Tree of Thought (ToT)", desc: "Agent branches multiple reasoning paths simultaneously, evaluates, prunes." },
      { name: "Beam Search Execution", desc: "Keep top-N candidate action sequences, not just one." },
      { name: "Curiosity-Driven", desc: "Agent generates and answers its own questions to fill knowledge gaps before acting." },
      { name: "Socratic Self-Questioning", desc: "Agent challenges its own assumptions with adversarial questions." }
    ]
  },
  {
    id: "multi-agent", icon: "🔗", title: "Multi-Agent Coordination",
    desc: "Patterns for distributing work across multiple agent roles.",
    patterns: [
      { name: "Orchestrator/Worker", desc: "One agent delegates to specialized sub-agents." },
      { name: "Debate Pattern", desc: "Two agents argue opposing sides; a judge agent decides." },
      { name: "Peer Review", desc: "Agent A produces output, Agent B critiques, A revises." },
      { name: "Swarm/Stigmergy", desc: "Many simple agents leaving 'traces' that guide collective behavior." }
    ]
  },
  {
    id: "stopping", icon: "🛑", title: "Stopping & Validation",
    desc: "Exit conditions and verification mechanisms for reliable completion.",
    patterns: [
      { name: "Proof-Gated Completion", desc: "Task isn't done until agent can demonstrate/prove the outcome." },
      { name: "Human-in-the-Loop Gate", desc: "Agent pauses at high-stakes decision points for approval." },
      { name: "Confidence Threshold", desc: "Agent only acts when internal confidence exceeds a threshold." },
      { name: "Falsification Test", desc: "Agent tries to disprove its own result before declaring success." }
    ]
  }
];

// ===== COMBINATION DATA =====
const combinations = [
  {
    id: "doubles", icon: "🔀", title: "Double Combinations",
    desc: "Two-pattern stacks — the foundational pairings.",
    combos: [
      { name: "Self-Goal + Proof-Gated Completion", patterns: ["Self-Goal","Proof-Gated Completion"],
        prompt: "Set your own goal for: [thing]. Make it outcome-based, include the validation/proof needed, then pursue it until complete.",
        rationale: "The agent owns the full task lifecycle — it defines what success looks like, establishes how to prove it, and self-terminates only when the proof is satisfied." },
      { name: "ReAct + Reflexion", patterns: ["ReAct","Reflexion"],
        prompt: "Attempt [task]. After each action, observe the result and critique your own reasoning in one sentence. If the critique reveals a flaw, correct your approach and retry. Stop only when your critique finds nothing to improve.",
        rationale: "ReAct keeps the agent grounded in real observations. Reflexion adds a self-correction layer so failure builds memory rather than being silently repeated." },
      { name: "Goal Decomposition + Orchestrator/Worker", patterns: ["Goal Decomposition","Orchestrator/Worker"],
        prompt: "Break [complex task] into the smallest independent sub-tasks possible. For each sub-task, define the worker responsible, the exact input it receives, and the exact output it must return. Execute all sub-tasks in dependency order and assemble the final result.",
        rationale: "Decomposition prevents any single agent from holding too much context. The orchestrator only manages routing and assembly — workers stay focused." },
      { name: "Tree of Thought + Falsification Test", patterns: ["Tree of Thought","Falsification Test"],
        prompt: "For [problem], generate three distinct solution approaches. For each approach, actively try to find a case where it would fail or produce a wrong answer. Eliminate any approach that fails its own falsification test. Present only the approach that survived.",
        rationale: "ToT prevents premature commitment. The falsification test forces the agent to steel-man against itself rather than just picking the most confident-sounding branch." },
      { name: "Constitutional AI + Human-in-the-Loop Gate", patterns: ["Constitutional AI","Human-in-the-Loop Gate"],
        prompt: "Complete [task] following these constraints: [rule 1], [rule 2], [rule 3]. Before finalizing any output that affects [high-stakes domain], pause and summarize what you are about to do, why it complies with each rule, and what the irreversible consequences are. Wait for approval.",
        rationale: "The constitution keeps the agent aligned during routine operation. The gate activates only for consequential decisions, preserving human oversight where it matters most." },
      { name: "Curiosity-Driven + Socratic Self-Questioning", patterns: ["Curiosity-Driven","Socratic Self-Questioning"],
        prompt: "Before working on [topic], list every assumption you are making. For each, ask: 'What if this is wrong?' Generate the strongest counter-evidence. Only begin once you have stated which assumptions survived and which were revised.",
        rationale: "The agent surfaces hidden priors before they contaminate the output. Socratic questioning prevents motivated reasoning." },
      { name: "Backtracking Goal + Confidence Threshold", patterns: ["Backtracking Goal","Confidence Threshold"],
        prompt: "Attempt [task] and rate confidence 0–100. If below 80, identify the weakest part, revise only that, and re-rate. Repeat until 80 or five revisions. Report final confidence alongside the answer.",
        rationale: "The threshold prevents both under-refinement and over-refinement. Targeting only the weakest component each pass is efficient." }
    ]
  }
];

// (Triples, Quads, Quints, Sextuples will be injected in Pass 3)

    { data: triplesCombos, id: 'triples', icon: '⚡', title: 'Triple Combinations', desc: 'Three-pattern stacks for high-stakes, complex, or fully autonomous tasks.', level: '3×', n: 3 },
    { data: quadsCombos, id: 'quads', icon: '⚡⚡', title: 'Quadruple Combinations', desc: 'Four-pattern stacks for maximum autonomy, precision, and robustness.', level: '4×', n: 4 },
    { data: quintsCombos, id: 'quints', icon: '⚡⚡⚡', title: 'Quintuple Combinations', desc: 'Five-pattern sovereign execution frameworks — not just prompts.', level: '5×', n: 5 },
    { data: sextupleCombos, id: 'sextuples', icon: '🌌', title: 'Sextuple Combinations', desc: 'Six-pattern agentic operating systems — complete execution philosophies.', level: '6×', n: 6 }
  ];

  comboSections.forEach(function(s) {
    var grid = addSection(s.id, s.icon, s.title, s.desc);
    s.data.forEach(function(c) { grid.appendChild(comboCard(c, s.level)); });
  });

  // Complexity legend — injected AFTER #doubles exists in DOM
  var firstComboSection = document.getElementById('doubles');
  if (firstComboSection) {
    var legendEl = document.createElement('div');
    legendEl.className = 'complexity-legend';
    legendEl.innerHTML = '<span class="leg-label">Complexity →</span>' +
      comboSections.map(function(s) {
        var pips = Array.from({length: s.n}, function() {
          return '<span class="leg-pip" style="background:' + pipColors[Math.min(s.n-2, pipColors.length-1)] + '; opacity:' + (0.5 + (s.n-2)*0.1).toFixed(1) + '"></span>';
        }).join('');
        return '<span class="leg-item"><span class="leg-pips">' + pips + '</span><span>' + s.n + '×</span></span>';
      }).join('<span style="color:var(--border);font-size:0.9rem">│</span>');
    firstComboSection.insertBefore(legendEl, firstComboSection.querySelector('.card-grid'));
  }

  // --- Render Lab Parameters ---
  var labGrid = addSection('lab-parameters', '🔬', 'Lab Parameters', 'The 12 experimental parameters — atomic behavioral levers extending the original pattern library.');
  labParameters.forEach(function(p) { labGrid.appendChild(labCard(p)); });

  // --- Render Matrix ---
  // Build tension lookup: key = "i,j" → note string
  var tensionLookup = {};
  matrixNotes.forEach(function(note) {
    // Each note starts with "Label1 + Label2: ..."
    var parts = note.split(': ');
    var pair = parts[0];
    var names = pair.split(' + ');
    var a = names[0].trim();
    var b = names[1] ? names[1].trim() : '';
    // Find indices
    var ai = matrixLabels.indexOf(a);
    var bi = matrixLabels.indexOf(b);
    if (ai !== -1 && bi !== -1) {
      tensionLookup[ai + ',' + bi] = note;
      tensionLookup[bi + ',' + ai] = note;
    }
  });

  // Synergy intensity: count synergies per row to compute local density
  var synergyCounts = matrixGrid.map(function(row) {
    return row.filter(function(v) { return v === 'S'; }).length;
  });
  var maxSyn = Math.max.apply(null, synergyCounts);

  var matrixSec = el('div','section');
  matrixSec.id = 'matrix';
  matrixSec.innerHTML = '<h2 class="section-title">📐 Parameter Interaction Matrix</h2><p class="section-desc">Hover any cell for details. Synergy intensity reflects connection density; tensions surface known tradeoffs.</p>';
  var wrap = el('div','matrix-wrap');
  var thead = '<thead><tr><th></th>' + matrixLabels.map(function(l){return '<th>' + l + '</th>';}).join('') + '</tr></thead>';
  var tbody = '<tbody>' + matrixGrid.map(function(row, i) {
    return '<tr><td>' + matrixLabels[i] + '</td>' + row.map(function(v, j) {
      if (v === '-') return '<td class="self">—</td>';
      if (v === 'T') {
        var key = i + ',' + j;
        var tipText = tensionLookup[key] ? tensionLookup[key] : 'Known tension — use with care.';
        return '<td class="tension">⚠️<span class="matrix-tip">' + tipText + '</span></td>';
      }
      // Synergy: 3 intensity levels based on row density
      var density = synergyCounts[i] / maxSyn;
      var cls = density > 0.75 ? 'synergy-3' : density > 0.5 ? 'synergy-2' : 'synergy-1';
      return '<td class="' + cls + '"><span class="matrix-tip">Synergy: ' + matrixLabels[i] + ' × ' + matrixLabels[j] + '</span>✓</td>';
    }).join('') + '</tr>';
  }).join('') + '</tbody>';
  wrap.innerHTML = '<table>' + thead + tbody + '</table>';
  matrixSec.appendChild(wrap);
  var notes = el('div','matrix-notes');
  notes.innerHTML = '<strong>Notes on tensions:</strong><br>' + matrixNotes.map(function(n){return '• ' + n;}).join('<br>');
  matrixSec.appendChild(notes);
  main.appendChild(matrixSec);

  // --- Sidebar ---
  // Build count map: sectionId → card count
  function getSectionCardCount(id) {
    var sec = document.getElementById(id);
    if (!sec) return 0;
    return sec.querySelectorAll('.card').length;
  }

  function addSidebarGroup(label, links) {
    sidebar.appendChild(el('h3', null, label));
    links.forEach(function(l) {
      var a = document.createElement('a');
      a.href = '#' + l.id;
      a.dataset.target = l.id;
      var count = getSectionCardCount(l.id);
      var countBadge = count > 0 ? '<span class="nav-count">' + count + '</span>' : '';
      a.innerHTML = '<span>' + l.text + '</span>' + countBadge;
      sidebar.appendChild(a);
    });
  }
  addSidebarGroup('Core Patterns', coreCategories.map(function(c){return {id:c.id, text:c.icon+' '+c.title.replace(' Patterns','')};}));
  addSidebarGroup('Combinations', comboSections.map(function(s){return {id:s.id, text:s.icon+' '+s.title.replace(' Combinations','')};}));
  addSidebarGroup('Laboratory', [{id:'lab-parameters',text:'🔬 Parameters'},{id:'matrix',text:'📐 Interaction Matrix'}]);

  // --- Hero Stats ---
  var totalPatterns = coreCategories.reduce(function(acc,cat){return acc + cat.patterns.length;}, 0);
  var totalCombos = combinations[0].combos.length + triplesCombos.length + quadsCombos.length + quintsCombos.length + sextupleCombos.length;
  var totalLab = labParameters.length;
  var statsEl = document.getElementById('heroStats');
  if (statsEl) {
    statsEl.innerHTML = [
      {num: totalPatterns, label: 'Core Patterns'},
      {num: totalCombos, label: 'Combinations'},
      {num: totalLab, label: 'Lab Parameters'}
    ].map(function(s) {
      return '<div class="stat-item"><span class="stat-num" id="stat-' + s.label.replace(/\s+/g,'-').toLowerCase() + '">' + s.num + '</span><span class="stat-label">' + s.label + '</span></div>';
    }).join('');
    // Animate counters
    statsEl.querySelectorAll('.stat-num').forEach(function(el) {
      var target = parseInt(el.textContent, 10);
      var start = 0;
      var duration = 900;
      var startTime = null;
      function step(timestamp) {
        if (!startTime) startTime = timestamp;
        var progress = Math.min((timestamp - startTime) / duration, 1);
        var eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.round(start + eased * (target - start));
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  // --- Scroll Spy ---
  var sidebarLinks = sidebar.querySelectorAll('a');
  var sections = main.querySelectorAll('.section');
  function updateScrollSpy() {
    var scrollY = window.scrollY + 120;
    var active = null;
    sections.forEach(function(s) { if (s.offsetTop <= scrollY) active = s.id; });
    sidebarLinks.forEach(function(a) {
      a.classList.toggle('active', a.dataset.target === active);
    });
  }
  window.addEventListener('scroll', updateScrollSpy);
  updateScrollSpy();

  // --- Search ---
  searchInput.addEventListener('input', function() {
    var q = this.value.toLowerCase().trim();
    var allCards = main.querySelectorAll('.card');
    var visible = 0;
    allCards.forEach(function(card) {
      var match = !q || card.dataset.search.indexOf(q) !== -1;
      card.classList.toggle('hidden', !match);
      if (match) visible++;
    });
    searchCount.textContent = q ? visible + ' match' + (visible !== 1 ? 'es' : '') : '';
  });

  // --- Copy to Clipboard ---
  // Inject toast element
  var toast = document.createElement('div');
  toast.id = 'copy-toast';
  toast.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Copied to clipboard';
  document.body.appendChild(toast);

  var toastTimer = null;
  function showToast() {
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 2200);
  }

  // Delegated click handler — intercepts clicks on blockquotes inside .card-expand
  main.addEventListener('click', function(e) {
    var bq = e.target.closest('.card-expand blockquote');
    if (!bq) return;
    // Stop the event propagating to the card so it doesn't toggle expand
    e.stopPropagation();
    // Get the text content minus the copy badge text
    var badge = bq.querySelector('.copy-badge');
    var textToCopy = badge
      ? bq.textContent.replace(badge.textContent, '').trim()
      : bq.textContent.trim();
    navigator.clipboard.writeText(textToCopy).then(function() {
      bq.classList.remove('blockquote-copied');
      // Force reflow to restart animation
      void bq.offsetWidth;
      bq.classList.add('blockquote-copied');
      showToast();
    }).catch(function() {
      // Fallback for browsers without clipboard API
      var ta = document.createElement('textarea');
      ta.value = textToCopy;
      ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast(); } catch(err) {}
      document.body.removeChild(ta);
    });
  });
})();
</script>

</body>
</html>
